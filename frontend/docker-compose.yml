version: '3.8'

# ==============================================================================
# Tirenn Commerce - React / Vite Frontend Microservice
# All configuration values are loaded strictly from .env
# ==============================================================================

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tirenn-frontend
    restart: always
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:80"
    networks:
      - tirenn-net

networks:
  tirenn-net:
    name: tirenn-net
    external: true
