version: '3.8'

# ==============================================================================
# Tirenn Commerce - React / Vite Frontend Microservice
# ==============================================================================

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8080/api/v1
        - VITE_BACKEND_URL=http://localhost:8080
        - VITE_AI_SERVICE_URL=http://localhost:8000/api/v1
    container_name: tirenn-frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - tirenn-net

networks:
  tirenn-net:
    name: tirenn-net
    external: true
