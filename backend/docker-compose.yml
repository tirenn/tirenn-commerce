version: '3.8'

# ==============================================================================
# Tirenn Commerce - Golang Backend Microservice
# All configuration values are loaded strictly from .env
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tirenn-backend
    restart: always
    env_file:
      - .env
    ports:
      - "${PORT:-8080}:8080"
    networks:
      - tirenn-net

networks:
  tirenn-net:
    name: tirenn-net
    external: true
