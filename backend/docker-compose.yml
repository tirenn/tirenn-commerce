version: '3.8'

# ==============================================================================
# Tirenn Commerce - Golang Backend Microservice
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tirenn-backend
    restart: always
    environment:
      PORT: 8080
      ENVIRONMENT: production
      AI_SERVICE_URL: http://ai-service:8000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: gouser
      DB_PASSWORD: gopassword
      DB_NAME: gocommerce_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RATE_LIMIT_REQUESTS_PER_MINUTE: 120
      RATE_LIMIT_WINDOW_SECONDS: 60
      JWT_SECRET: super-secret-tirenn-jwt-key-2026
      JWT_EXPIRE_HOURS: 24
    ports:
      - "8080:8080"
    networks:
      - tirenn-net

networks:
  tirenn-net:
    name: tirenn-net
    external: true
