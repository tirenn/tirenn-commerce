server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_name']
        regex: '/tirenn-(.*)'
        target_label: 'service'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    pipeline_stages:
      # 1. Parse Go Backend APP_LOG JSON
      - regex:
          expression: '^APP_LOG:\s*(?P<log_json>\{.*\})'
      - json:
          expressions:
            level: level
            layer: layer
            func: func
            event: event
            is_slow: is_slow
            request_id: request_id
            trace_id: trace_id
            span_id: span_id
            duration_ms: duration_ms
          source: log_json
      - labels:
          level:
          layer:
          func:
          event:
          is_slow:
          request_id:
          trace_id:

      # 2. Parse Go Backend HTTP_ACCESS_LOG JSON
      - regex:
          expression: '^HTTP_ACCESS_LOG:\s*(?P<http_json>\{.*\})'
      - json:
          expressions:
            request_id: request_id
            status_code: status_code
            latency_ms: latency_ms
            method: method
            path: path
          source: http_json
      - labels:
          status_code:
          method:

      # 3. Parse Python AI Service Structured Format
      - regex:
          expression: '^(?P<log_time>\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2},\d{3})\s+\[(?P<py_level>\w+)\]\s+\[trace:(?P<py_trace_id>[^\]]+)\]\s+\[span:(?P<py_span_id>[^\]]+)\]\s+\[req:(?P<py_request_id>[^\]]+)\]\s+(?P<py_logger>[\w\.\-]+):\s+(?P<py_msg>.*)'
      - labels:
          py_level:
          py_trace_id:
          py_span_id:
          py_request_id:
          py_logger:

