version: '3.8'

# ==============================================================================
# Tirenn Commerce - Python AI & Semantic Search Microservice
# All configuration values are loaded strictly from .env
# ==============================================================================

services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tirenn-ai-service
    restart: always
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:8000"
    networks:
      - tirenn-net

networks:
  tirenn-net:
    name: tirenn-net
    external: true
