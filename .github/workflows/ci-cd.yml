name: GoCommerce CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Golang Backend Verification & Test
  # -------------------------------------------------------------
  backend-ci:
    name: Backend (Go, Gin, GORM, Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Download Go Dependencies
        working-directory: ./backend
        run: go mod download

      - name: Verify Code with Go Vet
        working-directory: ./backend
        run: go vet ./...

      - name: Run Backend Unit Tests
        working-directory: ./backend
        run: go test -v ./...

      - name: Build Backend Binary
        working-directory: ./backend
        run: go build -v -o /tmp/server ./cmd/server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: gocommerce-backend:test

  # -------------------------------------------------------------
  # Job 2: Svelte Frontend Verification & Build
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend (Svelte, Vite, TypeScript, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Frontend Application
        working-directory: ./frontend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: gocommerce-frontend:test

  # -------------------------------------------------------------
  # Job 3: Docker Compose Validation
  # -------------------------------------------------------------
  compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: docker compose config
