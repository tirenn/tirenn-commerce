version: '3.8'

# ==============================================================================
# Tirenn Commerce - Core Infrastructure Stack
# Services: PostgreSQL (pgvector), Redis, Ollama, Loki, Promtail, Grafana
# All configuration values are loaded strictly from .env
# ==============================================================================

services:
  # 1. PostgreSQL Database with pgvector Extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tirenn-postgres
    restart: always
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tirenn-net

  # 2. Redis In-Memory Cache (Distributed Rate Limiting)
  redis:
    image: redis:7-alpine
    container_name: tirenn-redis
    restart: always
    env_file:
      - .env
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tirenn-net

  # 3. Ollama LLM Container (Qwen 2.5 for AI Shopper)
  ollama:
    image: ollama/ollama:latest
    container_name: tirenn-ollama
    restart: always
    env_file:
      - .env
    environment:
      # Limit to 1 parallel request to prevent RAM overflow on small VPS
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      # Only keep 1 model loaded in memory at a time
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      # Keep model in memory (don't unload between requests)
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - tirenn-net

  # 3.1. Ollama Automatic Model Provisioner (Pulls models on first boot / deployment)
  ollama-init:
    image: curlimages/curl:latest
    container_name: tirenn-ollama-init
    restart: "no"
    env_file:
      - .env
    depends_on:
      - ollama
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "⏳ Waiting for Ollama service to become healthy..."
        until curl -s http://ollama:11434/api/tags > /dev/null 2>&1; do
          sleep 2
        done
        echo "🚀 Ollama is ready. Checking & pulling required AI models..."
        CHAT_MODEL=$${OLLAMA_CHAT_MODEL:-qwen2.5:3b}
        EMBED_MODEL=$${OLLAMA_EMBED_MODEL:-bge-m3}
        echo "📥 Ensuring Chat LLM is ready: $$CHAT_MODEL"
        curl -s -X POST http://ollama:11434/api/pull -d "{\"name\": \"$$CHAT_MODEL\"}"
        echo ""
        echo "📥 Ensuring Embedding Model is ready: $$EMBED_MODEL"
        curl -s -X POST http://ollama:11434/api/pull -d "{\"name\": \"$$EMBED_MODEL\"}"
        echo ""
        echo "✅ All required Ollama models are verified and ready!"
    networks:
      - tirenn-net

  # 4. Centralized Log Storage Engine (Grafana Loki)
  loki:
    image: grafana/loki:3.0.0
    container_name: tirenn-loki
    restart: always
    env_file:
      - .env
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./logging/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    networks:
      - tirenn-net

  # 5. Log Collector & Docker Shipper (Grafana Promtail)
  promtail:
    image: grafana/promtail:3.0.0
    container_name: tirenn-promtail
    restart: always
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logging/promtail-config.yml:/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - tirenn-net

  # 6. Unified Log Visualization Dashboard (Grafana)
  grafana:
    image: grafana/grafana:latest
    container_name: tirenn-grafana
    restart: always
    env_file:
      - .env
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./logging/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./logging/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./logging/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - loki
    networks:
      - tirenn-net

networks:
  tirenn-net:
    name: tirenn-net
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_models:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
